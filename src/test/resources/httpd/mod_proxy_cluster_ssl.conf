# mod_proxy_cluster configuration for test suite — mTLS variant
# This file replaces mod_proxy_cluster.conf when mutual TLS is configured.
# It is copied over the original by SSLConfigurator.configureHttpdMtlsBalancer().
#
# Differences from mod_proxy_cluster.conf:
#   - VirtualHost *:8090 has SSLEngine on (mTLS for MCMP management channel)
#   - Additional VirtualHost *:8443 for data path mTLS
#   - Certificate paths use @@SSL_DIR@@ placeholder (replaced at runtime)

# Ensure prerequisite base modules are loaded (may be commented out in freshly built httpd)
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !proxy_ajp_module>
    LoadModule proxy_ajp_module modules/mod_proxy_ajp.so
</IfModule>
<IfModule !slotmem_shm_module>
    LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
</IfModule>
<IfModule !watchdog_module>
    LoadModule watchdog_module modules/mod_watchdog.so
</IfModule>

# Load mod_proxy_cluster modules (not part of standard httpd distribution).
# IfModule guards handle distributions where conf.modules.d/ already loads these.
<IfModule !manager_module>
    LoadModule manager_module modules/mod_manager.so
</IfModule>
<IfModule !proxy_cluster_module>
    LoadModule proxy_cluster_module modules/mod_proxy_cluster.so
</IfModule>
<IfModule !advertise_module>
    LoadModule advertise_module modules/mod_advertise.so
</IfModule>
# Version-specific modules — mod_proxy_cluster 2.x and 1.3.x are NOT compatible.
# mod_lbmethod_cluster: 2.x only (lbmethod as separate module)
# mod_cluster_slotmem:  1.3.x only (replaces mod_slotmem_shm for cluster use)
<IfFile modules/mod_lbmethod_cluster.so>
    LoadModule lbmethod_cluster_module modules/mod_lbmethod_cluster.so
</IfFile>
<IfFile modules/mod_cluster_slotmem.so>
    LoadModule cluster_slotmem_module modules/mod_cluster_slotmem.so
</IfFile>

# WebSocket support: proxy_wstunnel may not be loaded by default
<IfModule !proxy_wstunnel_module>
    LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
</IfModule>

# SSL module
<IfModule !ssl_module>
    LoadModule ssl_module modules/mod_ssl.so
</IfModule>

ProxyPreserveHost On

# WebSocket support: allow HTTP Upgrade to websocket protocol
# This is the mod_proxy_cluster equivalent of ProxyPass upgrade=websocket
WSUpgradeHeader websocket

# Do NOT set ProxyTimeout — it overrides WildFly's node-timeout CONFIG value.
# Backend response read timeout is controlled by:
#   1. WildFly's 'node-timeout' attribute (sent as Timeout in CONFIG message)
#   2. Apache's Timeout directive (fallback when node-timeout is not set)
# TCP connect timeout is controlled by WildFly's 'ping' attribute, not ProxyTimeout.
Timeout 300

# MCMP management listener on port 8090 — with mTLS
Listen 8090
Listen 8443
ManagerBalancerName mycluster

# MCMP mTLS on port 8090 (replaces the plain-HTTP VirtualHost from mod_proxy_cluster.conf)
# SSLVerifyClient optional — workers present client certs (validated against CA chain and CRL),
# but the test-code McmpClient can query without one.
<VirtualHost *:8090>
    SSLEngine on
    SSLCertificateFile @@SSL_DIR@@/server.cert.pem
    SSLCertificateKeyFile @@SSL_DIR@@/server.nopass.key.pem
    SSLCACertificateFile @@SSL_DIR@@/ca-chain.cert.pem
    SSLVerifyClient optional
    SSLVerifyDepth 3
    EnableMCMPReceive
    ServerAdvertise Off
    <Location />
        Require all granted
    </Location>
    <Location /mod_cluster_manager>
        SetHandler mod_cluster-manager
        Require all granted
    </Location>
</VirtualHost>

# Data path mTLS on port 8443
# SSLVerifyClient require — clients must present a valid client cert.
<VirtualHost *:8443>
    SSLEngine on
    SSLCertificateFile @@SSL_DIR@@/server.cert.pem
    SSLCertificateKeyFile @@SSL_DIR@@/server.nopass.key.pem
    SSLCACertificateFile @@SSL_DIR@@/ca-chain.cert.pem
    SSLVerifyClient require
    SSLVerifyDepth 3
</VirtualHost>

# Include optional configuration files (added dynamically during tests)
IncludeOptional conf/extra/ssl-*.conf
